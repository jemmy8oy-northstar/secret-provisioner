{{- /*
What this pod may do to Secrets: CREATE, and nothing else (James, secret-provisioner#9).

  create — POST /api/v1/namespaces/<ns>/secrets              (a Secret that does not exist)
  create — POST /api/v1/namespaces/<ns>/secrets?dryRun=All   (does it exist? 409 AlreadyExists if so)

NO get, list, watch, patch, update or delete. get/list/watch return Secret VALUES — there is no
RBAC verb for "key names only" — so without them this pod cannot read any Secret in the namespace,
including the ones it did not create. Without patch/update/delete it cannot change or remove one.
That is enforced by the API server, so no bug in the code can turn into a read or an overwrite.

A Role per namespace, not a ClusterRole — see `targetNamespaces` in values.yaml.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
{{- range .Values.targetNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "app.fullname" $ }}
  namespace: {{ . }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "app.fullname" $ }}
  namespace: {{ . }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "app.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "app.fullname" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
